name: Bug report
description: An error, a crash, something imported in the wrong place, a panel that doesn't work
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: "0.24.0"
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version and OS
      placeholder: "5.1.2, Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Character tab, import Face_01 (Medium)
        2. Select the head, Clothing tab, import …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message / log
      description: The red error text, Blender's system console output, or Finals panel → Show Log
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The Exports folder in the add-on preferences is set (the panel shows a check mark)
        - label: Check Setup (panel footer) reports no missing folders, or I listed them above
